[package]
name = "footical-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "footical-generator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-sdk-s3 = { version = "1", features = ["rustls"] }
aws-config = { version = "1", features = ["rustls"] }
chrono = "0.4"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["full"] }
