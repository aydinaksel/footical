[workspace]
members = ["crates/website", "crates/scraper", "crates/secrets"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true

[[workspace.metadata.leptos]]
name = "footical-website"
bin-package = "footical-website"
lib-package = "footical-website"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "crates/website/style/input.css"
site-addr = "0.0.0.0:3003"
reload-port = 5004
bin-features = ["ssr"]
lib-features = ["hydrate"]

[workspace.lints.clippy]
# Don't panic
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
exit = "deny"
as_conversions = "deny"

# Don't fail silently
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"

# Don't hold locks across await points
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"

# Don't mishandle memory
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"

# Don't compare or cast numbers carelessly
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
invalid_upcast_comparisons = "deny"

# Easy wins
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"

# Suppressions must carry a reason
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
