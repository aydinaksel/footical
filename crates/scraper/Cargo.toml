[package]
name = "footical-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chromiumoxide = "0.9.1"
chrono = "0.4"
footical-fulltime = { path = "../fulltime" }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "derive"] }
tokio = { version = "1", features = ["time", "process", "io-util"] }
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt"] }
