[package]
name = "footical-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "derive"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
