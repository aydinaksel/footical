[package]
name = "footical-website"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "footical-website"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
leptos-use = { version = "0.19", features = ["use_clipboard", "storage", "on_click_outside"] }
codee = { version = "0.3", features = ["json_serde"] }

# SSR
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
tower = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
footical-scraper = { path = "../scraper", optional = true }
footical-secrets = { path = "../secrets", optional = true }

# Hydrate
wasm-bindgen = { version = "=0.2.121", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }

[features]
default = []
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "leptos-use/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:tower",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:footical-scraper",
    "dep:footical-secrets",
]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
