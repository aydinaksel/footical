app = "footical"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  LEPTOS_SITE_ADDR = "0.0.0.0:3000"
  LEPTOS_SITE_ROOT = "/app/site"
  ICAL_OUTPUT_DIR = "/data/ical"
  SCRAPE_HOUR = "1"

[http_service]
  internal_port = 3000
  force_https = true

[mounts]
  source = "footical_data"
  destination = "/data"
